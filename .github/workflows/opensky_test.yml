name: OpenSky test

on:
  workflow_dispatch:
    inputs:
      days:
        description: "取得日数（前日から遡る）"
        default: "7"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch departures from OpenSky
        env:
          OS_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OS_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          python3 - <<'EOF'
          import os, sys, json, time, csv, urllib.request, urllib.parse, urllib.error, datetime
          AIRPORTS = """RJTT RJAA RJOO RJBB RJBE RJGG RJCC RJFF ROAH RJFK RJFT RJFM RJFO RJFU RJOM RJOT
          RJOA RJSS RJCH RJEC RJCK RJCB RJCM RJCN RJCW RJNK RJNT RJSN RJSA RJSK RJSI RJSM RJSY RJSC
          RJSF RJOB RJOK RJOS RJOC RJOR RJOH RJOW RJOI RJDC RJFR RJFS RJFE RJFG RJFC RJKA RJKN ROIG
          ROMY RJNS RJAH RJCO RJBD RJNW RJTH""".split()
          TOKEN_URL = "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token"
          os.makedirs("out", exist_ok=True)
          cid = os.environ.get("OS_ID", "").strip(); sec = os.environ.get("OS_SECRET", "").strip()
          print("[check] client id length:", len(cid), " secret length:", len(sec))
          if not cid or not sec:
              print("[ERROR] secret が読めていません。Name が OPENSKY_CLIENT_ID / OPENSKY_CLIENT_SECRET か確認"); sys.exit(1)
          tok = {"v": None, "t": 0}
          def token():
              if tok["v"] and time.time() - tok["t"] < 1500:
                  return tok["v"]
              body = urllib.parse.urlencode({"grant_type": "client_credentials",
                  "client_id": cid, "client_secret": sec}).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(TOKEN_URL, data=body), timeout=60) as r:
                      tok["v"] = json.load(r)["access_token"]; tok["t"] = time.time()
              except urllib.error.HTTPError as e:
                  print("[ERROR] token HTTP", e.code, e.read()[:300]); sys.exit(1)
              except Exception as e:
                  print("[ERROR] token", repr(e)); sys.exit(1)
              return tok["v"]
          token()
          print("[check] token OK")
          days = int(os.environ.get("DAYS") or 7)
          today = datetime.datetime.now(datetime.timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
          rows, log = [], []
          def save():
              with open("out/departures.csv", "w", newline="") as f:
                  w = csv.writer(f); w.writerow(["callsign","icao24","dep","arr","firstSeen","lastSeen","depDist","arrDist"]); w.writerows(rows)
              with open("out/log.csv", "w", newline="") as f:
                  w = csv.writer(f); w.writerow(["airport","dayBegin","count"]); w.writerows(log)
          def get(url):
              last = None
              for attempt in range(3):
                  req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token()})
                  try:
                      with urllib.request.urlopen(req, timeout=90) as r:
                          return json.load(r), None
                  except urllib.error.HTTPError as e:
                      if e.code == 404: return [], None
                      if e.code == 429: return None, "429 retry-after " + str(e.headers.get("X-Rate-Limit-Retry-After-Seconds"))
                      if e.code == 401: tok["v"] = None
                      last = f"HTTP {e.code} {e.read()[:200]!r}"
                  except Exception as e:
                      last = repr(e)
                  time.sleep(5 * (attempt + 1))
              return None, last
          stop = False; fails = 0
          for d in range(days, 0, -1):
              begin = int((today - datetime.timedelta(days=d)).timestamp()); end = begin + 86400
              for ap in AIRPORTS:
                  data, err = get(f"https://opensky-network.org/api/flights/departure?airport={ap}&begin={begin}&end={end}")
                  if data is None:
                      n = "ERR " + err; fails += 1
                      if err.startswith("429") or fails >= 10: stop = True
                  else:
                      n = len(data)
                      for f in data:
                          rows.append([(f.get("callsign") or "").strip(), f.get("icao24"),
                              f.get("estDepartureAirport"), f.get("estArrivalAirport"),
                              f.get("firstSeen"), f.get("lastSeen"),
                              f.get("estDepartureAirportHorizDistance"), f.get("estArrivalAirportHorizDistance")])
                  log.append([ap, begin, n]); print(ap, begin, n, flush=True)
                  if stop: break
                  time.sleep(0.3)
              save()
              if stop:
                  print("[STOP] エラーが続いたため途中で終了"); break
          save()
          print("total flights", len(rows), " errors", fails)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opensky-test
          path: out/
          if-no-files-found: warn
