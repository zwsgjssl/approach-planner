name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 公開するのはアプリ本体・地図データ・PWA用ファイルだけ(スクリプトや資料は載せない)
      - name: Build site
        run: |
          mkdir -p _site/icons
          cp approach_planner.html _site/index.html
          cp approach_planner.html manifest.webmanifest sw.js _site/
          cp icons/*.png _site/icons/
          cp map_data_*.js _site/ 2>/dev/null || echo "map_data_*.js がありません(地図なしで公開します)"
          cp flightdb.json _site/ 2>/dev/null || echo "flightdb.json がありません(便名検索なしで公開します)"
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
